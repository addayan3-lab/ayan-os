<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="阿岩 OS / AYAN OS">
<defs>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#142743"/><stop offset=".64" stop-color="#0B172B"/><stop offset="1" stop-color="#070F1D"/>
  </linearGradient>
  <linearGradient id="champagne" x1="0" y1="0" x2=".7" y2="1">
    <stop stop-color="#FFF1D4"/><stop offset=".34" stop-color="#E5BA77"/><stop offset=".73" stop-color="#D7A25B"/><stop offset="1" stop-color="#F7D7A0"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#F9DCA3" stop-opacity=".25"/><stop offset="1" stop-color="#F9DCA3" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="512" height="512" rx="112" fill="url(#navy)"/>
<g opacity=".24" stroke="#56708D" stroke-width="1.5" fill="none">
  <path d="M12 337Q100 278 180 336T340 329T520 332"/><path d="M0 362Q85 308 161 349T311 347T520 352"/>
</g>
<circle cx="261" cy="215" r="140" fill="url(#glow)" class="ayan-halo"/>
<g fill="none" stroke="url(#champagne)" stroke-linecap="round" stroke-linejoin="round">
  <path d="M112 347L227 123Q243 92 266 119L394 345" stroke-width="44" class="ayan-mountain"/>
  <path d="M127 359Q211 297 265 324Q319 347 388 298" stroke-width="15" class="ayan-river"/>
  <path d="M128 389Q208 350 272 378Q333 398 401 369" stroke-width="7" opacity=".65" class="ayan-river ayan-river-second"/>
</g>
<circle cx="268" cy="238" r="46" fill="url(#champagne)" class="ayan-sun"/>
<path d="M124 429Q258 410 385 429" fill="none" stroke="#E6BE7E" stroke-width="2" opacity=".32"/>
<style>
@media (prefers-reduced-motion: no-preference) {
 .ayan-halo {transform-origin:261px 215px;animation:ayanBreath 7s ease-in-out infinite}
 .ayan-sun {transform-origin:268px 238px;animation:ayanSun 7s ease-in-out infinite}
 .ayan-river {stroke-dasharray:620;stroke-dashoffset:0;animation:ayanFlow 9s linear infinite}
 .ayan-river-second {animation-duration:14s}
}
@keyframes ayanBreath {0%,100%{opacity:.58;transform:scale(.88)}50%{opacity:1;transform:scale(1.09)}}
@keyframes ayanSun {0%,100%{opacity:.92;transform:translateY(3px)}50%{opacity:1;transform:translateY(-6px)}}
@keyframes ayanFlow {0%{stroke-dashoffset:0}100%{stroke-dashoffset:-1240}}
</style>
</svg>